<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Spring Legal Consultancy</title>
    <link rel="shortcut icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --pink: #e91e8c; --pink-dark: #c2185b; --pink-light: #f8bbd0;
            --pink-pale: #fce4ec; --pink-wash: #fdf2f8;
            --bg: #f5f2f7; --bg-card: #ffffff; --bg-input: #faf8fb;
            --border: rgba(233,30,140,0.10); --border-focus: rgba(233,30,140,0.35);
            --text: #4a3d50; --text-dim: #8c7e94; --text-bright: #2d2429;
            --radius: 12px; --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --green: #2e7d32; --red: #d32f2f;
        }
        html { scroll-behavior: smooth; }
        body { font-family: "Inter", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }

        /* ── Login Screen ── */
        .login-overlay {
            position: fixed; inset: 0; z-index: 1000; background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .login-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .login-box {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
            padding: 48px 40px; width: 400px; max-width: 90vw; text-align: center;
            box-shadow: 0 20px 60px rgba(233,30,140,0.08);
        }
        .login-box img { width: 56px; margin: 0 auto 16px; }
        .login-box h1 { font-size: 1.4rem; font-weight: 800; color: var(--text-bright); margin-bottom: 6px; }
        .login-box p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 28px; }
        .login-box input {
            width: 100%; padding: 14px 16px; background: var(--bg-input); border: 1.5px solid var(--border);
            border-radius: 10px; color: var(--text-bright); font: inherit; font-size: 0.92rem; outline: none;
            transition: border var(--transition);
        }
        .password-container {
            position: relative;
            margin-bottom: 16px;
        }
        .password-container input {
            padding-right: 44px;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            font-size: 1.05rem;
            transition: color var(--transition);
        }
        .password-toggle:hover {
            color: var(--pink);
        }
        .login-box input:focus { border-color: var(--pink); }
        .login-box .btn-login {
            width: 100%; padding: 14px; background: var(--pink); color: #fff; border: none;
            border-radius: 10px; font: inherit; font-weight: 700; font-size: 0.95rem;
            cursor: pointer; transition: all var(--transition);
        }
        .login-box .btn-login:hover { background: var(--pink-dark); transform: translateY(-2px); }
        .login-error { color: var(--red); font-size: 0.82rem; margin-bottom: 12px; display: none; }

        /* ── Sidebar ── */
        .app { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px; background: var(--bg-card); border-right: 1px solid var(--border);
            padding: 24px 0; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto;
            display: flex; flex-direction: column; box-shadow: 2px 0 12px rgba(233,30,140,0.04);
        }
        .sidebar-brand { display: flex; align-items: center; justify-content: center; padding: 16px 16px 14px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
        .sidebar-brand img { width: 100%; height: 50px; object-fit: contain; }
        .sidebar-nav { flex: 1; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 12px; padding: 11px 20px;
            color: var(--text-dim); font-size: 0.86rem; font-weight: 600;
            transition: all var(--transition); border-left: 3px solid transparent; text-decoration: none;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            color: var(--pink); background: rgba(233,30,140,0.06); border-left-color: var(--pink);
        }
        .sidebar-nav a i { width: 18px; text-align: center; font-size: 0.9rem; }
        .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
        .sidebar-footer a {
            display: flex; align-items: center; gap: 10px; color: var(--text-dim);
            font-size: 0.82rem; font-weight: 600; text-decoration: none; transition: color var(--transition);
        }
        .sidebar-footer a:hover { color: var(--red); }

        /* ── Main ── */
        .main { flex: 1; margin-left: 260px; padding: 32px 40px; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
        }
        .topbar h2 { font-size: 1.5rem; font-weight: 800; color: var(--text-bright); }
        .topbar-actions { display: flex; gap: 10px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px;
            border-radius: 10px; font: inherit; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; transition: all var(--transition); border: none;
        }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-pink:hover { background: var(--pink-dark); transform: translateY(-1px); }
        .btn-outline { background: transparent; color: var(--pink); border: 1.5px solid var(--border); }
        .btn-outline:hover { border-color: var(--pink); background: rgba(233,30,140,0.06); }

        /* ── Sections ── */
        .content-section { display: none; }
        .content-section.active { display: block; }
        .card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            padding: 28px; margin-bottom: 20px; transition: border-color var(--transition);
            box-shadow: 0 2px 12px rgba(233,30,140,0.04);
        }
        .card:hover { border-color: var(--border-focus); }
        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
        }
        .card-header h3 { font-size: 1rem; font-weight: 700; color: var(--text-bright); }
        .card-badge {
            font-size: 0.68rem; font-weight: 700; padding: 4px 12px; border-radius: 20px;
            background: rgba(233,30,140,0.1); color: var(--pink); letter-spacing: 0.06em; text-transform: uppercase;
        }
        .field { margin-bottom: 18px; }
        .field:last-child { margin-bottom: 0; }
        .field label {
            display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
        }
        .field input, .field textarea {
            width: 100%; padding: 12px 14px; background: var(--bg-input); border: 1.5px solid var(--border);
            border-radius: 10px; color: var(--text-bright); font: inherit; font-size: 0.9rem;
            outline: none; transition: all var(--transition); resize: vertical;
        }
        .field input:focus, .field textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(233,30,140,0.1); }
        .field textarea { min-height: 100px; line-height: 1.6; }
        .field-hint { font-size: 0.72rem; color: var(--text-dim); margin-top: 4px; font-style: italic; }
        .save-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* ── Toast ── */
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            padding: 14px 22px; border-radius: 12px; font-size: 0.86rem; font-weight: 600;
            color: #fff; display: flex; align-items: center; gap: 10px;
            animation: toastIn 0.4s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            min-width: 280px;
        }
        .toast.success { background: linear-gradient(135deg, #2e7d32, #4caf50); }
        .toast.error { background: linear-gradient(135deg, #c62828, #ef5350); }
        .toast.out { animation: toastOut 0.3s ease forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

        /* ── Loading ── */
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(233,30,140,0.2); border-top-color: var(--pink); border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .page-loader {
            display: flex; align-items: center; justify-content: center; height: 60vh;
            flex-direction: column; gap: 16px; color: var(--text-dim);
        }
        .page-loader .spinner { width: 32px; height: 32px; border-width: 3px; border-top-color: var(--pink); border-color: var(--border); border-top-color: var(--pink); }

        /* ── Mobile Top Header ── */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }
        .mobile-menu-btn {
            background: none;
            border: none;
            color: var(--text-bright);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all var(--transition);
        }
        .mobile-menu-btn:hover {
            background: rgba(233,30,140,0.06);
            color: var(--pink);
        }
        .mobile-logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            max-width: 160px;
        }
        .mobile-header-logo {
            max-height: 100%;
            width: auto;
            object-fit: contain;
        }
        .btn-save-mobile {
            padding: 8px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        /* ── Sidebar Drawer Overlay ── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 998;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar {
                transform: translateX(-100%);
                z-index: 999;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 4px 0 20px rgba(0,0,0,0.3);
            }
            .sidebar.active {
                transform: translateX(0);
                display: flex;
            }
            .sidebar-brand {
                display: none !important;
            }
            .sidebar-overlay {
                display: block;
            }
            .main {
                margin-left: 0;
                padding: 80px 16px 20px 16px; /* offset top for fixed mobile header */
            }
            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .topbar h2 {
                font-size: 1.3rem;
            }
            .topbar-actions {
                width: 100%;
                justify-content: space-between;
                display: flex;
                gap: 10px;
            }
            .topbar-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .topbar-actions #saveAllBtn {
                display: none !important;
            }
            .card {
                padding: 18px;
            }
        }
    </style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <img src="logo.png" alt="Logo">
        <h1>Admin Panel</h1>
        <p>Enter your admin password to continue</p>
        <div class="login-error" id="loginError">Incorrect password. Please try again.</div>
        <div class="password-container">
            <input type="password" id="loginPassword" placeholder="Admin Password" autofocus>
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle Password Visibility">
                <i class="fa-solid fa-eye" id="passwordEyeIcon"></i>
            </button>
        </div>
        <button class="btn-login" id="loginBtn" onclick="attemptLogin()">Sign In</button>
    </div>
</div>

<!-- ═══ APP ═══ -->
<div class="app" id="app" style="display:none;">
    <div class="mobile-header">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="mobile-logo-wrap">
            <img src="logo.png" alt="Logo" class="mobile-header-logo">
        </div>
        <button class="btn btn-pink btn-save-mobile" onclick="saveCurrentSection()" aria-label="Save Changes">
            <i class="fa-solid fa-cloud-arrow-up"></i> Save
        </button>
    </div>
    
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
        <div class="sidebar-brand"><img src="logo.png" alt="Logo"></div>
        <nav class="sidebar-nav" id="sidebarNav">
            <a href="#" data-section="general" class="active"><i class="fa-solid fa-bars"></i> Navigation &amp; Logo</a>
            <a href="#" data-section="hero"><i class="fa-solid fa-home"></i> Hero Section</a>
            <a href="#" data-section="about"><i class="fa-solid fa-info-circle"></i> About SLC</a>
            <a href="#" data-section="mission"><i class="fa-solid fa-bullseye"></i> Commitments (Navy Split)</a>
            <a href="#" data-section="services"><i class="fa-solid fa-briefcase"></i> Practice Areas</a>
            <a href="#" data-section="team"><i class="fa-solid fa-users"></i> Team Members</a>
            <a href="#" data-section="contact"><i class="fa-solid fa-envelope"></i> Contact &amp; Consult</a>
            <a href="#" data-section="footer"><i class="fa-solid fa-cog"></i> Footer Details</a>
        </nav>
        <div class="sidebar-footer">
            <a href="/" target="_blank"><i class="fa-solid fa-external-link-alt"></i> View Live Site</a>
            <a href="#" onclick="logout()" style="margin-top: 12px; color: var(--red);"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h2 id="sectionTitle">Hero Section</h2>
            <div class="topbar-actions">
                <button class="btn btn-outline" onclick="loadContent()"><i class="fa-solid fa-rotate"></i> Refresh</button>
                <button class="btn btn-pink" id="saveAllBtn" onclick="saveCurrentSection()"><i class="fa-solid fa-cloud-arrow-up"></i> Save Changes</button>
            </div>
        </div>

        <div id="contentArea">
            <div class="page-loader"><div class="spinner"></div><span>Loading content...</span></div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
    // ═══ CONFIG — No keys exposed, all requests go through server API ═══
    let contentData = {};
    let currentSection = 'general';

    // ═══ API HELPERS ═══
    async function fetchContent() {
        const res = await fetch('/api/get-content');
        if (!res.ok) throw new Error('Failed to load content');
        return res.json();
    }

    async function verifyPassword(pw) {
        const res = await fetch('/api/verify-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw })
        });
        if (!res.ok) return false;
        const data = await res.json();
        return data.success === true;
    }

    // ═══ LOGIN ═══
    async function attemptLogin() {
        const pw = document.getElementById('loginPassword').value;
        try {
            const valid = await verifyPassword(pw);
            if (valid) {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('app').style.display = 'flex';
                sessionStorage.setItem('slc_admin', '1');
                sessionStorage.setItem('slc_pw', pw);
                loadContent();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        } catch (e) {
            showToast('Connection error: ' + e.message, 'error');
        }
    }

    document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });

    // Auto-login if session active
    if (sessionStorage.getItem('slc_admin')) {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('app').style.display = 'flex';
        loadContent();
    }

    // ═══ LOAD CONTENT ═══
    async function loadContent() {
        try {
            const rows = await fetchContent();
            contentData = {};
            rows.forEach(r => contentData[r.section_key] = r.content);
            renderSection(currentSection);
            showToast('Content loaded successfully', 'success');
        } catch (e) {
            showToast('Failed to load: ' + e.message, 'error');
        }
    }

    // ═══ SECTION DEFINITIONS ═══
    const sections = {
        general: {
            title: 'Navigation & Logo Actions',
            cards: [{
                title: 'Header Buttons Text', badge: 'Top Navigation',
                fields: [
                    { key: 'header_call_text', label: 'Call Us Button Text', type: 'input' },
                    { key: 'header_consult_text', label: 'Consult/Request Button Text', type: 'input' },
                ]
            }]
        },
        hero: {
            title: 'Hero Section',
            cards: [{
                title: 'Hero Main Content', badge: 'Slider Content',
                fields: [
                    { key: 'hero_badge', label: 'Top Small Badge Text', type: 'input' },
                    { key: 'hero_title_line1', label: 'Headline - Line 1', type: 'input', hint: 'e.g. "Legal clarity for"' },
                    { key: 'hero_title_highlight', label: 'Headline - Pink Highlighted Word', type: 'input', hint: 'e.g. "high-stakes"' },
                    { key: 'hero_title_line2', label: 'Headline - Line 2', type: 'input', hint: 'e.g. "decisions."' },
                    { key: 'hero_tagline', label: 'Tagline (Slogan)', type: 'input' },
                    { key: 'hero_description', label: 'Main Description Paragraph', type: 'textarea' },
                    { key: 'hero_cta_consult', label: 'Primary CTA Button (Consult)', type: 'input' },
                    { key: 'hero_cta_explore', label: 'Secondary CTA Button (Explore)', type: 'input' },
                ]
            }, {
                title: 'Overlapping Quick-Link Cards', badge: 'Features Grid',
                fields: [
                    { key: 'overlap_card_1_title', label: 'Card 1 - Title', type: 'input' },
                    { key: 'overlap_card_1_desc', label: 'Card 1 - Description', type: 'textarea' },
                    { key: 'overlap_card_2_title', label: 'Card 2 - Title', type: 'input' },
                    { key: 'overlap_card_2_desc', label: 'Card 2 - Description', type: 'textarea' },
                    { key: 'overlap_card_3_title', label: 'Card 3 - Title', type: 'input' },
                    { key: 'overlap_card_3_desc', label: 'Card 3 - Description', type: 'textarea' },
                ]
            }]
        },
        about: {
            title: 'About SLC Overview',
            cards: [{
                title: 'Firm Overview Details', badge: 'Main Content',
                fields: [
                    { key: 'about_tag', label: 'Section Small Tag', type: 'input' },
                    { key: 'about_heading', label: 'Main Heading', type: 'input' },
                    { key: 'about_para_1', label: 'Description Paragraph 1', type: 'textarea' },
                    { key: 'about_para_2', label: 'Description Paragraph 2', type: 'textarea' },
                ]
            }, {
                title: 'Our Core Values List', badge: 'Values List',
                fields: [
                    { key: 'about_values_title', label: 'Values Box Heading', type: 'input' },
                    { key: 'about_value_1_title', label: 'Value 1 - Name', type: 'input' },
                    { key: 'about_value_1_desc', label: 'Value 1 - Description', type: 'input' },
                    { key: 'about_value_2_title', label: 'Value 2 - Name', type: 'input' },
                    { key: 'about_value_2_desc', label: 'Value 2 - Description', type: 'input' },
                    { key: 'about_value_3_title', label: 'Value 3 - Name', type: 'input' },
                    { key: 'about_value_3_desc', label: 'Value 3 - Description', type: 'input' },
                    { key: 'about_value_4_title', label: 'Value 4 - Name', type: 'input' },
                    { key: 'about_value_4_desc', label: 'Value 4 - Description', type: 'input' },
                    { key: 'about_value_5_title', label: 'Value 5 - Name', type: 'input' },
                    { key: 'about_value_5_desc', label: 'Value 5 - Description', type: 'input' },
                ]
            }]
        },
        mission: {
            title: 'SLC Commitments',
            cards: [{
                title: 'Credentials & Accomplishments', badge: 'Navy Left Card',
                fields: [
                    { key: 'navy_tag', label: 'Commitment Small Tag', type: 'input' },
                    { key: 'navy_heading', label: 'Accomplishments Heading', type: 'input' },
                    { key: 'navy_desc', label: 'Accomplishments Description', type: 'textarea' },
                    { key: 'navy_cred_1', label: 'Credential Item 1', type: 'input' },
                    { key: 'navy_cred_2', label: 'Credential Item 2', type: 'input' },
                    { key: 'navy_cred_3', label: 'Credential Item 3', type: 'input' },
                    { key: 'navy_cred_4', label: 'Credential Item 4', type: 'input' },
                ]
            }, {
                title: 'Mission & Vision Statements', badge: 'Navy Right Card',
                fields: [
                    { key: 'mission_title', label: 'Mission Title', type: 'input' },
                    { key: 'mission_text', label: 'Mission Statement Text', type: 'textarea' },
                    { key: 'vision_title', label: 'Vision Title', type: 'input' },
                    { key: 'vision_text', label: 'Vision Statement Text', type: 'textarea' },
                ]
            }]
        },
        services: {
            title: 'Practice Areas',
            cards: [
                { i: 1, name: 'Aviation Law' },
                { i: 2, name: 'Corporate & Commercial' },
                { i: 3, name: 'Dispute Resolution' },
                { i: 4, name: 'Real Estate & Property' },
                { i: 5, name: 'Private Client & Family' },
                { i: 6, name: 'Banking & Finance' },
                { i: 7, name: 'Civil Construction' },
                { i: 8, name: 'Insurance Claims' },
                { i: 9, name: 'Natural Resources Law' },
            ].map(s => ({
                title: `${s.i}. ${s.name}`, badge: 'Practice Card',
                fields: [
                    { key: `service_${s.i}_title`, label: 'Practice Area Title', type: 'input' },
                    { key: `service_${s.i}_desc`, label: 'Description Paragraph', type: 'textarea' },
                    { key: `service_${s.i}_btn`, label: 'Read More Text', type: 'input' },
                ]
            }))
        },
        team: {
            title: 'Team Members',
            cards: [
                { n: 1, name: 'Mrs. Ruby Akua Aglagoh' },
                { n: 2, name: 'Alexander Nii Kwartey Owoo' },
                { n: 3, name: 'Ernest Assie' },
            ].map(m => ({
                title: m.name, badge: `Member ${m.n}`,
                fields: [
                    { key: `team_${m.n}_location`, label: 'Location Tag', type: 'input' },
                    { key: `team_${m.n}_name`, label: 'Full Name', type: 'input' },
                    { key: `team_${m.n}_role`, label: 'Role & Titles', type: 'input' },
                    { key: `team_${m.n}_bio`, label: 'Detailed Biography', type: 'textarea' },
                ]
            }))
        },
        contact: {
            title: 'Contact Details & Consultations',
            cards: [{
                title: 'Contact Header Content', badge: 'Layout Title',
                fields: [
                    { key: 'contact_heading', label: 'Section Main Heading', type: 'input' },
                    { key: 'contact_subheading', label: 'Section Subheading Text', type: 'textarea' },
                ]
            }, {
                title: 'Quick Info Block Labels', badge: 'Contact Boxes',
                fields: [
                    { key: 'contact_address_title', label: 'Address Card Title', type: 'input' },
                    { key: 'contact_address', label: 'Office Address Text', type: 'input' },
                    { key: 'contact_phone_title', label: 'Phone Card Title', type: 'input' },
                    { key: 'contact_phone', label: 'Phone Number Text', type: 'input' },
                    { key: 'contact_email_title', label: 'Email Card Title', type: 'input' },
                    { key: 'contact_email', label: 'Email Address Text', type: 'input' },
                    { key: 'contact_hours_title', label: 'Hours Card Title', type: 'input' },
                    { key: 'contact_hours', label: 'Office Hours Text', type: 'input' },
                ]
            }, {
                title: 'Consultation Form Labels', badge: 'Form Setup',
                fields: [
                    { key: 'contact_form_title', label: 'Form Box Heading', type: 'input' },
                    { key: 'contact_select_default', label: 'Practice Dropdown First Choice label', type: 'input' },
                    { key: 'contact_form_btn', label: 'Submission Button text', type: 'input' },
                ]
            }]
        },
        footer: {
            title: 'Footer Branding details',
            cards: [{
                title: 'Footer Content Options', badge: 'Bottom Layout',
                fields: [
                    { key: 'footer_description', label: 'Short Firm Bio Paragraph', type: 'textarea' },
                    { key: 'footer_copyright', label: 'Footer Copyright Statement', type: 'input' },
                ]
            }]
        }
    };

    // ═══ RENDER ═══
    function renderSection(sectionId) {
        const section = sections[sectionId];
        if (!section) return;
        let html = '';
        section.cards.forEach(card => {
            html += `<div class="card"><div class="card-header"><h3>${card.title}</h3><span class="card-badge">${card.badge}</span></div>`;
            card.fields.forEach(f => {
                const val = (contentData[f.key] || '').replace(/"/g, '&quot;');
                html += `<div class="field"><label>${f.label}</label>`;
                if (f.type === 'textarea') {
                    html += `<textarea data-key="${f.key}">${contentData[f.key] || ''}</textarea>`;
                } else {
                    html += `<input type="text" data-key="${f.key}" value="${val}">`;
                }
                if (f.hint) html += `<div class="field-hint">${f.hint}</div>`;
                html += `</div>`;
            });
            html += `</div>`;
        });
        document.getElementById('contentArea').innerHTML = html;
    }

    // ═══ SAVE ═══
    async function saveCurrentSection() {
        const btn = document.getElementById('saveAllBtn');
        btn.innerHTML = '<span class="spinner"></span> Saving...';
        btn.disabled = true;

        const fields = document.querySelectorAll('#contentArea [data-key]');
        let saved = 0, errors = 0;
        const updates = [];

        for (const el of fields) {
            const key = el.dataset.key;
            const val = el.value;
            if (contentData[key] === val) continue;
            updates.push({ key, value: val });
        }

        if (updates.length === 0) {
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save Changes';
            btn.disabled = false;
            showToast('No changes to save', 'success');
            return;
        }

        try {
            const res = await fetch('/api/update-content', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionStorage.getItem('slc_pw'), updates })
            });
            const result = await res.json();
            if (!res.ok) throw new Error(result.error);
            updates.forEach(u => contentData[u.key] = u.value);
            saved = result.saved;
            errors = result.errors;
        } catch (e) {
            errors = updates.length;
        }

        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save Changes';
        btn.disabled = false;

        if (errors > 0) {
            showToast(`Saved ${saved} fields, ${errors} failed`, 'error');
        } else if (saved > 0) {
            showToast(`${saved} field${saved > 1 ? 's' : ''} updated successfully!`, 'success');
        } else {
            showToast('No changes to save', 'success');
        }
    }

    // ═══ SIDEBAR NAV ═══
    document.getElementById('sidebarNav').addEventListener('click', e => {
        const a = e.target.closest('a[data-section]');
        if (!a) return;
        e.preventDefault();
        document.querySelectorAll('.sidebar-nav a').forEach(l => l.classList.remove('active'));
        a.classList.add('active');
        currentSection = a.dataset.section;
        document.getElementById('sectionTitle').textContent = sections[currentSection].title;
        renderSection(currentSection);
    });

    // ═══ TOAST ═══
    function showToast(msg, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
        container.appendChild(toast);
        setTimeout(() => { toast.classList.add('out'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    // ═══ LOGOUT ═══
    function logout() {
        sessionStorage.removeItem('slc_admin');
        sessionStorage.removeItem('slc_pw');
        window.location.href = 'admin';
    }

    // ═══ PASSWORD VISIBILITY TOGGLE ═══
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('loginPassword');
        const eyeIcon = document.getElementById('passwordEyeIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }

    // ═══ MOBILE SIDEBAR TOGGLE ═══
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.querySelector('.sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    function openMobileSidebar() {
        sidebar.classList.add('active');
        sidebarOverlay.classList.add('active');
    }

    function closeMobileSidebar() {
        sidebar.classList.remove('active');
        sidebarOverlay.classList.remove('active');
    }

    if (mobileMenuBtn) {
        mobileMenuBtn.addEventListener('click', openMobileSidebar);
    }
    if (sidebarOverlay) {
        sidebarOverlay.addEventListener('click', closeMobileSidebar);
    }
    document.querySelectorAll('.sidebar-nav a').forEach(link => {
        link.addEventListener('click', closeMobileSidebar);
    });
</script>
</body>
</html>
